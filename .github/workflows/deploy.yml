name: Build and Deploy Superhero Battle Arena

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pygbag
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame-ce pygbag==0.9.3

      - name: Build web game
        run: |
          python -m pygbag --build --html --ume_block 0 .

      - name: Remove obsolete BrowserFS reference
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path("build/web/index.html")

          if index.exists():
              text = index.read_text(encoding="utf-8")

              text = text.replace(
                  '<script src="https://pygame-web.github.io/cdn/0.9.3/browserfs.min.js"></script>',
                  ''
              )

              text = text.replace(
                  '<script src="https://pygame-web.github.io/cdn/0.9.3//browserfs.min.js"></script>',
                  ''
              )

              index.write_text(text, encoding="utf-8")
              print("BrowserFS reference removed from index.html")
          else:
              print("index.html not found")
              raise SystemExit(1)
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
